name: Render soundtrack video
on:
  workflow_dispatch:
    inputs:
      title:
        description: Movie or show title, optionally followed by its release year
        required: true
        type: string
      composer:
        description: Composer (optional; improves search, titles, and tags)
        required: false
        type: string
        default: ''
      style:
        description: "mix: passages arranged along an intensity arc. album: cues play in full, in order, with a tracklist"
        required: false
        type: choice
        options: [mix, album]
        default: mix
      minutes:
        description: Video length in minutes (1–180)
        required: false
        type: string
        default: '60'
      audio_urls:
        description: Optional audio links (direct files, Google Drive, Dropbox), separated by spaces. Skips the YouTube audio search
        required: false
        type: string
        default: ''
      characters:
        description: Optional comma-separated character names for scene search (default comes from Wikidata)
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  render:
    runs-on: ${{ vars.SOUNDTRACK_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install rendering tools
        run: |
          python -m pip install --upgrade -r requirements.txt
          python -m yt_dlp --version
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            toolkit="$RUNNER_TEMP/soundtrack-tools"
            mkdir -p "$toolkit"
            cd "$toolkit"
            upstream=https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
            curl -fsSL --retry 2 --max-time 90 "$upstream/ffmpeg-linux-x64.gz" -o ffmpeg.gz
            curl -fsSL --retry 2 --max-time 90 "$upstream/ffprobe-linux-x64.gz" -o ffprobe.gz
            sha256sum -c <<'CHECKSUMS'
          bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa  ffmpeg.gz
          25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067  ffprobe.gz
          CHECKSUMS
            gzip -d ffmpeg.gz ffprobe.gz
            chmod +x ffmpeg ffprobe
            echo "$toolkit" >> "$GITHUB_PATH"
          fi
          if [ ! -r /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] ||
             [ ! -r /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf ]; then
            fonts="$RUNNER_TEMP/soundtrack-fonts"
            mkdir -p "$fonts"
            upstream=https://raw.githubusercontent.com/matplotlib/matplotlib/v3.10.0/lib/matplotlib/mpl-data/fonts/ttf
            for font in DejaVuSans-Bold.ttf DejaVuSansMono.ttf; do
              curl -fsSL --retry 2 --max-time 30 "$upstream/$font" -o "$fonts/$font"
            done
            echo "SOUNDTRACK_FONT_DIR=$fonts" >> "$GITHUB_ENV"
          fi
      - name: Sign in to YouTube with the YOUTUBE_COOKIES secret
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          cookies="$RUNNER_TEMP/youtube-cookies.txt"
          python -m soundtrack.cookies "$cookies"
          if [ -f "$cookies" ]; then
            echo "SOUNDTRACK_COOKIES=$cookies" >> "$GITHUB_ENV"
          fi
      - name: Start the YouTube proof-of-origin token provider
        # Best effort: helps yt-dlp pass YouTube's bot checks. The render still runs without it.
        continue-on-error: true
        run: |
          python -m pip install --upgrade bgutil-ytdlp-pot-provider
          docker run --detach --init --name bgutil-provider -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 5
          docker ps --filter name=bgutil-provider --format '{{.Status}}'
      - name: Route YouTube traffic through Cloudflare WARP or the YOUTUBE_PROXY secret
        # YouTube refuses video and audio to GitHub's runner addresses. A YOUTUBE_PROXY secret
        # takes priority; otherwise Cloudflare WARP runs as a local SOCKS proxy.
        continue-on-error: true
        env:
          YOUTUBE_PROXY: ${{ secrets.YOUTUBE_PROXY }}
        run: |
          if [ -n "$YOUTUBE_PROXY" ]; then
            echo "::add-mask::$YOUTUBE_PROXY"
            echo "SOUNDTRACK_PROXY=$YOUTUBE_PROXY" >> "$GITHUB_ENV"
            echo "Using the YOUTUBE_PROXY secret."
            exit 0
          fi
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg |
            sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" |
            sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          for i in $(seq 1 20); do warp-cli --accept-tos status >/dev/null 2>&1 && break; sleep 1; done
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          for i in $(seq 1 30); do
            if curl -s --max-time 5 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q 'warp=on'; then
              echo "SOUNDTRACK_PROXY=socks5://127.0.0.1:40000" >> "$GITHUB_ENV"
              echo "Cloudflare WARP is connected."
              exit 0
            fi
            sleep 2
          done
          warp-cli --accept-tos status || true
          echo "::warning::Cloudflare WARP did not connect; downloads will go out directly."
      - uses: actions/cache@v4
        with:
          path: ~/.cache/soundtrack-models
          key: face-models-48b10fa
      - name: Find audio and scenes, arrange, and render
        env:
          SOUNDTRACK_TITLE: ${{ inputs.title }}
          SOUNDTRACK_COMPOSER: ${{ inputs.composer }}
          SOUNDTRACK_STYLE: ${{ inputs.style }}
          SOUNDTRACK_MINUTES: ${{ inputs.minutes }}
          SOUNDTRACK_AUDIO_URLS: ${{ inputs.audio_urls }}
          SOUNDTRACK_CHARACTERS: ${{ inputs.characters }}
        run: |
          case "$SOUNDTRACK_MINUTES" in
            ''|*[!0-9]*) echo "::error::minutes must be a whole number" >&2; exit 1 ;;
          esac
          extra=()
          if [ -n "${SOUNDTRACK_AUDIO_URLS// }" ]; then extra+=(--audio-url "$SOUNDTRACK_AUDIO_URLS"); fi
          if [ -n "${SOUNDTRACK_CHARACTERS// }" ]; then extra+=(--characters "$SOUNDTRACK_CHARACTERS"); fi
          python render.py --title="$SOUNDTRACK_TITLE" --composer="$SOUNDTRACK_COMPOSER" \
            --style="$SOUNDTRACK_STYLE" --minutes="$SOUNDTRACK_MINUTES" "${extra[@]}"
      - name: Remove the cookies file
        if: always()
        run: rm -f "$RUNNER_TEMP/youtube-cookies.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: soundtrack-video
          path: dist/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
